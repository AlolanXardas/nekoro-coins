plugins {
    id 'java-library'
    id 'net.neoforged.gradle.userdev' version '7.1.21'
}

version = mod_version
group = 'dev.xardas'
base.archivesName = 'nekorocoins'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

sourceSets.main {
    java.srcDirs '../common/java-core', '../common/java-mixin'
    resources.srcDir '../common/resources'
}

runs {
    configureEach {
        modSource project.sourceSets.main
    }
    server {
        argument '--nogui'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
}

processResources {
    inputs.property 'version', version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: version
    }
}

jar {
    archiveFileName = "Nekoro-C-${version}-NeoForge-${minecraft_version}.jar"
    from('../../LICENSE')
    manifest {
        attributes([
            'Specification-Title'   : 'nekorocoins',
            'Specification-Vendor'  : 'Alolan Xardas',
            'Specification-Version' : '1',
            'Implementation-Title'  : 'Nekoro Coins',
            'Implementation-Version': version,
            'Implementation-Vendor' : 'Alolan Xardas'
        ])
    }
}
